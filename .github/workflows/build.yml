name: Build CrossTalk
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser audio and connections
        run: npm test
      - name: Build and test Paper plugin
        run: bash gradlew :core:test :spigot:shadowJar --no-daemon
      - name: Package installation files
        run: |
          mkdir -p release/CrossTalk-Paper/deploy
          cp spigot/build/libs/CrossTalk-Paper-*.jar release/CrossTalk-Paper/
          cp START-HERE.md LICENSE NOTICE release/CrossTalk-Paper/
          cp deploy/Caddyfile.example release/CrossTalk-Paper/deploy/
          cd release/CrossTalk-Paper
          sha256sum *.jar > SHA256SUMS.txt
          cd ..
          zip -r CrossTalk-Paper-Install.zip CrossTalk-Paper
      - uses: actions/upload-artifact@v4
        with:
          name: CrossTalk-Paper
          path: release/
          if-no-files-found: error
